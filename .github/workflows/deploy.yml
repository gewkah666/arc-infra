name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    # Self-hosted runner on the Tencent Cloud server (label `arc-infra-deploy`).
    # Eliminates: SSH dance, PAT secret, rsync of compose files, manual image load.
    # The runner already has docker, the working tree, and ghcr.io creds (via
    # GITHUB_TOKEN with packages:read).
    runs-on: [self-hosted, arc-infra-deploy]

    steps:
      - name: Checkout arc-infra
        uses: actions/checkout@v4

      - name: Sync checkout -> ~/arc-infra
        # Run docker compose from ~/arc-infra so the project name stays
        # `arc-infra` (project name defaults to the dir name).
        # rsync is more reliable than cp -a across filesystems (cp tries to
        # preserve ownership which fails when runner user != dest file owner).
        run: |
          rsync -a --delete \
            --exclude='.git' --exclude='.github' \
            ./ ~/arc-infra/
          mkdir -p ~/arc-infra/data/videos
          cd ~/arc-infra

      - name: Login to ghcr.io
        # logout: false — on a self-hosted runner, the credentials persist
        # across job runs and need to remain for subsequent `docker compose
        # pull` to find them. Logout (default true) deletes them right after
        # this step, making the immediate next `docker compose pull` get 403.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false

      - name: Pull latest images
        run: docker compose pull

      - name: Stop existing stack
        run: docker compose down --remove-orphans || true

      - name: Boot stack
        run: docker compose up -d

      - name: Wait for gateway health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health 2>/dev/null; then
              echo "gateway healthy"
              exit 0
            fi
            sleep 2
          done
          echo "::error::gateway did not become healthy in 60s"
          docker compose logs --tail=50 gateway
          exit 1

      - name: Show final state
        run: docker compose ps