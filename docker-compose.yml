# Arc full-stack docker-compose
#
# Brings up the entire Arc stack using the upstream repos as build contexts:
#   - ../arc-gateway       Rust API gateway
#   - ../arc-core          Python pose service + Celery worker
#   - ../arc-web-admin     React admin SPA
#
# Each upstream repo has its own .github/workflows/ci.yml that builds and
# tests the image independently. This compose file is for local dev / single-
# host deploys where everything runs on one docker host.

services:
  gateway:
    build:
      context: ../arc-gateway
      dockerfile: docker/Dockerfile
    image: arc-gateway:local
    ports:
      - "8000:8000"
    environment:
      - APP__DATABASE_URL=postgresql://postgres:postgres@db:5432/arc
      - APP__REDIS_URL=redis://redis:6379/0
      - APP__RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - APP__POSE_SERVICE_URL=pose-service:50051
      - APP__VIDEO_UPLOAD_DIR=/app/data/videos
      - APP__JWT_SECRET=dev-secret-key-change-in-production
      - APP__JWT_EXPIRATION_HOURS=24
      - APP__SERVER_HOST=0.0.0.0
      - APP__SERVER_PORT=8000
      - APP__ADMIN_INITIAL_USERNAME=admin
      - APP__ADMIN_INITIAL_PASSWORD=admin123
    depends_on:
      - db
      - redis
      - rabbitmq
      - pose-service
    volumes:
      # data/videos is owned by arc-gateway (the upload endpoint writes here).
      # Both gateway and celery-worker need read/write access.
      - ../arc-gateway/data/videos:/app/data/videos

  pose-service:
    build:
      context: ../arc-core
      dockerfile: docker/Dockerfile
    image: arc-pose-service:local
    ports:
      - "50051:50051"
    command: ["python", "-m", "app.services.pose_server"]

  celery-worker:
    build:
      context: ../arc-core
      dockerfile: docker/Dockerfile
    image: arc-celery-worker:local
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/arc
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - VIDEO_UPLOAD_DIR=/app/data/videos
      - MEDIAPIPE_POSE_MODEL_PATH=/app/models/pose_landmarker_lite.task
    depends_on:
      - db
      - redis
      - rabbitmq
    volumes:
      - ../arc-gateway/data/videos:/app/data/videos
      - ../arc-core/models:/app/models
    command: celery -A app.tasks.celery_tasks worker --loglevel=info

  web-admin:
    build:
      context: ../arc-web-admin
      dockerfile: Dockerfile
    image: arc-web-admin:local
    ports:
      - "3000:80"
    depends_on:
      - gateway

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=arc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data:
  redis_data: